<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sporting Witness PoC</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  button { font-size: 1.1rem; padding: 12px 16px; margin: 4px 8px 4px 0; }
  .controls button { min-width: 6em; }
  ul { list-style: none; padding: 0; }
  li button { width: 100%; text-align: left; }
  fieldset { margin: 12px 0; }
  #log { font-family: monospace; font-size: .85rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Sporting Witness test page</h1>
<p><a href="test/">Go to the VoiceOver audio test page</a></p>

<h2>Now playing</h2>
<p id="status" role="status" aria-live="polite">Nothing playing</p>
<div class="controls">
  <button id="playPause" type="button">Play</button>
  <button id="stop" type="button">Stop</button>
  <button id="next" type="button">Next episode</button>
</div>

<h2>Oldest episodes</h2>
<ul id="list"></ul>

<h2>Audio mode test</h2>
<fieldset id="modeBox">
  <legend>Audio mode. Change this if VoiceOver goes silent while playing.</legend>
  <label><input type="radio" name="mode" value="auto" checked> Default</label><br>
  <label><input type="radio" name="mode" value="playback"> Playback</label><br>
  <label><input type="radio" name="mode" value="ambient"> Ambient, mixes with other sounds but obeys the silent switch</label>
</fieldset>

<h2>Log</h2>
<div id="log"></div>

<!-- No native controls: the player is driven only by the buttons above -->
<audio id="player" preload="none"></audio>

<script>
const FEED = 'https://podcasts.files.bbci.co.uk/p00j2pn5.rss';
const player = document.getElementById('player');
const statusEl = document.getElementById('status');
const playPauseBtn = document.getElementById('playPause');
let episodes = [];
let current = -1;

const log = msg => { document.getElementById('log').textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n'; };
const say = msg => { statusEl.textContent = msg; log(msg); };

// Safari 16.4+ lets the page choose how its audio shares the device with other sounds, including VoiceOver
if (navigator.audioSession) {
  log('Audio session API available, type ' + navigator.audioSession.type);
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => {
    navigator.audioSession.type = r.value;
    log('Audio mode set to ' + navigator.audioSession.type);
  }));
} else {
  document.getElementById('modeBox').hidden = true;
  log('Audio session API not available');
}

async function load() {
  log('Fetching feed');
  const res = await fetch(FEED);
  const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
  episodes = [...xml.querySelectorAll('item')].map(item => ({
    title: item.querySelector('title')?.textContent,
    date: new Date(item.querySelector('pubDate')?.textContent),
    // Upgrade to https so the page isn't loading mixed content
    url: item.querySelector('enclosure')?.getAttribute('url').replace(/^http:/, 'https:'),
  })).sort((a, b) => a.date - b.date);
  log(`Loaded ${episodes.length} episodes, oldest ${episodes[0].date.toDateString()}`);

  const list = document.getElementById('list');
  episodes.slice(0, 5).forEach((ep, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `Play ${ep.title}, ${ep.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    btn.onclick = () => playEpisode(i);
    li.append(btn);
    list.append(li);
  });
}

function playEpisode(i) {
  current = i;
  const ep = episodes[i];
  player.src = ep.url;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: 'Sporting Witness', album: 'BBC World Service' });
  }
  start();
}

function start() {
  if (current < 0) return playEpisode(0);
  player.play().catch(e => say('Could not play: ' + e.message));
}

function pause() { player.pause(); }

function stop() {
  player.pause();
  player.currentTime = 0;
  say('Stopped');
}

function next() {
  if (current + 1 < episodes.length) playEpisode(current + 1);
}

playPauseBtn.onclick = () => player.paused ? start() : pause();
document.getElementById('stop').onclick = stop;
document.getElementById('next').onclick = next;

player.addEventListener('playing', () => { playPauseBtn.textContent = 'Pause'; say('Playing ' + episodes[current].title); });
player.addEventListener('pause', () => { playPauseBtn.textContent = 'Play'; if (player.currentTime > 0) say('Paused'); });
player.addEventListener('ended', () => { log('Episode ended'); next(); });
player.addEventListener('error', () => say('Audio error ' + player.error?.code + ' ' + (player.error?.message || '')));

// Lets Magic Tap (two-finger double tap) and lock screen buttons control this page
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', start);
  navigator.mediaSession.setActionHandler('pause', pause);
  navigator.mediaSession.setActionHandler('stop', stop);
  navigator.mediaSession.setActionHandler('nexttrack', next);
}

load().catch(e => say('Could not load episodes: ' + e.message));
</script>
</body>
</html>
