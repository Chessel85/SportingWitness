<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceOver audio test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  button { display: block; width: 100%; font-size: 1.1rem; padding: 12px 16px; margin: 8px 0; text-align: left; }
</style>
</head>
<body>
<h1>VoiceOver audio test</h1>
<p><a href="../">Back to the Sporting Witness page</a></p>
<p>Each button plays a 10 second tone, except the last one. While it plays, swipe to the next item and check whether VoiceOver still speaks.</p>
<p id="status" role="status" aria-live="polite"></p>

<h2>Tests</h2>
<button type="button" data-test="webaudio">Test 1. Tone made by the page itself</button>
<button type="button" data-src="tone-48k-stereo.m4a">Test 2. AAC file, 48 kilohertz stereo</button>
<button type="button" data-src="tone-48k-stereo.mp3">Test 3. MP3 file, 48 kilohertz stereo</button>
<button type="button" data-src="tone-44k-mono.mp3">Test 4. MP3 file, 44.1 kilohertz mono, same format as the BBC</button>
<button type="button" data-src="https://open.live.bbc.co.uk/mediaselector/6/redir/version/2.0/mediaset/audio-nondrm-download-rss/proto/http/vpid/p02r47yp.mp3">Test 5. The real BBC episode</button>
<button type="button" id="stop">Stop</button>

<script>
const player = new Audio();
const statusEl = document.getElementById('status');
let ctx;

document.querySelectorAll('button[data-src], button[data-test]').forEach(btn => btn.addEventListener('click', () => {
  stop();
  const name = btn.textContent.split('.')[0];
  if (btn.dataset.test === 'webaudio') {
    ctx = ctx || new AudioContext();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 10);
  } else {
    player.src = btn.dataset.src;
    player.play().catch(e => { statusEl.textContent = name + ' failed: ' + e.message; });
  }
  statusEl.textContent = name + ' playing';
}));

function stop() {
  player.pause();
  if (ctx) ctx.suspend().then(() => ctx.close());
  ctx = null;
}

document.getElementById('stop').onclick = () => { stop(); statusEl.textContent = 'Stopped'; };
player.addEventListener('ended', () => { statusEl.textContent = 'Finished'; });
</script>
</body>
</html>
